[package]
name = "example-translator"      # the library's name; module.toml's `entry` names it too
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[lib]
# `cdylib` is the library Glossa loads; `rlib` lets `cargo test` call the
# module's functions directly.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK lives in the Glossa repository. Pin a tag (`tag = "v0.2.0"`) or a
# commit (`rev = "…"`) once one carries what you need, so a change on main
# cannot break your build.
glossa-module-sdk = { git = "https://github.com/bropines/glossa", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A small library: Glossa loads it into its own process.
opt-level = "s"
lto = true
codegen-units = 1
panic = "unwind"   # export_module! turns a panic into an error instead of a crash
strip = true
